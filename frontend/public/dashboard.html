<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard | Vieira Barbearia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/styles.css" rel="stylesheet">
  </head>
  <body>
    <main class="app-shell dashboard-page">
      <section class="dashboard-main">
        <div class="d-flex align-items-center justify-content-between flex-wrap gap-3 mb-4">
          <div>
            <p class="eyebrow mb-2">Area protegida</p>
            <h1 class="display-font section-title mb-0">Dashboard</h1>
            <span id="welcomeText" class="muted fs-5"></span>
          </div>
          <div class="dashboard-actions">
            <a class="btn btn-outline-soft" href="/"><i class="bi bi-calendar-event me-2"></i>Agenda publica</a>
            <button id="clearScheduleButton" class="btn btn-danger-soft" type="button"><i class="bi bi-trash3 me-2"></i>Limpar agenda</button>
            <button id="logoutButton" class="btn btn-orange" type="button"><i class="bi bi-box-arrow-right me-2"></i>Sair</button>
          </div>
        </div>

        <div class="row g-4 mb-4">
          <div class="col-md-4">
            <div class="dashboard-card">
              <div class="muted">Agendamentos</div>
              <div id="appointmentsCount" class="display-font fs-1">0</div>
            </div>
          </div>
          <div class="col-md-4">
            <div class="dashboard-card">
              <div class="muted">Pendentes</div>
              <div id="pendingCount" class="display-font fs-1">0</div>
            </div>
          </div>
          <div class="col-md-4">
            <div class="dashboard-card">
              <div class="muted">Agendamentos de hoje</div>
              <div id="todayCount" class="display-font fs-1">0</div>
            </div>
          </div>
        </div>

        <section class="dashboard-card">
          <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-3">
            <div>
              <h2 class="h3 mb-1">Solicitacoes de horario</h2>
              <div id="dashboardMessage" class="alert-line"></div>
            </div>
            <button id="refreshButton" class="btn btn-outline-soft" type="button" title="Atualizar"><i class="bi bi-arrow-clockwise"></i></button>
          </div>
          <div class="table-responsive dashboard-table-wrap">
            <table class="table align-middle dashboard-table">
              <thead>
                <tr>
                  <th>Cliente</th>
                  <th>Servico</th>
                  <th>Data</th>
                  <th>Horario</th>
                  <th>Status</th>
                  <th>Acoes</th>
                </tr>
              </thead>
              <tbody id="appointmentsBody"></tbody>
            </table>
          </div>
          <div id="appointmentsEmpty" class="muted"></div>
        </section>
      </section>
    </main>

    <script src="/api.js"></script>
    <script src="/dashboard.js"></script>
  </body>
</html>
