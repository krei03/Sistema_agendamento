<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cadastro | Vieira Barbearia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/styles.css" rel="stylesheet">
  </head>
  <body>
    <main class="auth-page">
      <section class="auth-card">
        <p class="eyebrow">Area do barbeiro</p>
        <h1 class="display-font mb-4">Cadastro</h1>
        <form id="registerForm" class="row g-3">
          <div class="col-md-6">
            <label class="form-label" for="name">Nome</label>
            <input class="form-control" id="name" required>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="username">Usuario</label>
            <input class="form-control" id="username" required>
          </div>
          <div class="col-md-7">
            <label class="form-label" for="email">Email</label>
            <input class="form-control" id="email" type="email" required>
          </div>
          <div class="col-md-5">
            <label class="form-label" for="phone">Telefone</label>
            <input class="form-control" id="phone" required>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="shopName">Barbearia</label>
            <input class="form-control" id="shopName" value="Vieira Barbearia" required>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="password">Senha</label>
            <input class="form-control" id="password" type="password" minlength="6" required>
          </div>
          <div class="col-12">
            <label class="form-label" for="address">Endereco</label>
            <input class="form-control" id="address" value="Borges de Medeiros 238" required>
          </div>
          <div class="col-12">
            <button class="btn btn-orange btn-lg w-100 py-3" type="submit">Criar cadastro</button>
          </div>
          <div class="col-12">
            <div id="registerMessage" class="alert-line"></div>
          </div>
        </form>
        <div class="mt-4"><a href="/acesso-vieira">Ja tenho login</a></div>
      </section>
    </main>
    <script src="/api.js"></script>
    <script src="/register.js"></script>
  </body>
</html>
