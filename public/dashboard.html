<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard | Vieira Barbearia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/styles.css" rel="stylesheet">
  </head>
  <body>
    <main class="app-shell">
      <div class="container-fluid">
        <div class="row min-vh-100">
          <aside class="col-lg-3 col-xl-2 sidebar p-4">
            <div class="brand-mark fs-4 mb-5">Vieira <span>Barbearia</span></div>
            <nav class="d-grid gap-2">
              <a class="btn btn-outline-soft text-start" href="/dashboard.html"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a>
              <a class="btn btn-outline-soft text-start" href="/"><i class="bi bi-calendar-event me-2"></i>Agenda publica</a>
              <button id="logoutButton" class="btn btn-orange text-start" type="button"><i class="bi bi-box-arrow-right me-2"></i>Sair</button>
            </nav>
          </aside>

          <section class="col-lg-9 col-xl-10 p-4 p-lg-5">
            <div class="d-flex align-items-center justify-content-between flex-wrap gap-3 mb-4">
              <div>
                <p class="eyebrow mb-2">Area protegida</p>
                <h1 class="display-font section-title mb-0">Dashboard</h1>
              </div>
              <span id="welcomeText" class="muted fs-5"></span>
            </div>

            <div class="row g-4 mb-4">
              <div class="col-md-4">
                <div class="dashboard-card">
                  <div class="muted">Agendamentos</div>
                  <div id="appointmentsCount" class="display-font fs-1">0</div>
                </div>
              </div>
              <div class="col-md-4">
                <div class="dashboard-card">
                  <div class="muted">Pendentes</div>
                  <div id="pendingCount" class="display-font fs-1">0</div>
                </div>
              </div>
              <div class="col-md-4">
                <div class="dashboard-card">
                  <div class="muted">Perfil</div>
                  <div class="display-font fs-1">Ativo</div>
                </div>
              </div>
            </div>

            <div class="row g-4">
              <div class="col-xl-5">
                <section class="dashboard-card">
                  <h2 class="h3 mb-4">Meus dados</h2>
                  <form id="profileForm" class="row g-3">
                    <div class="col-md-6">
                      <label class="form-label" for="name">Nome</label>
                      <input class="form-control" id="name" required>
                    </div>
                    <div class="col-md-6">
                      <label class="form-label" for="username">Usuario</label>
                      <input class="form-control" id="username" disabled>
                    </div>
                    <div class="col-md-7">
                      <label class="form-label" for="email">Email</label>
                      <input class="form-control" id="email" type="email" required>
                    </div>
                    <div class="col-md-5">
                      <label class="form-label" for="phone">Telefone</label>
                      <input class="form-control" id="phone" required>
                    </div>
                    <div class="col-12">
                      <label class="form-label" for="shopName">Barbearia</label>
                      <input class="form-control" id="shopName" required>
                    </div>
                    <div class="col-12">
                      <label class="form-label" for="address">Endereco</label>
                      <input class="form-control" id="address" required>
                    </div>
                    <div class="col-12">
                      <button class="btn btn-orange w-100 py-3" type="submit">Salvar dados</button>
                    </div>
                    <div class="col-12">
                      <div id="profileMessage" class="alert-line"></div>
                    </div>
                  </form>
                </section>
              </div>

              <div class="col-xl-7">
                <section class="dashboard-card">
                  <div class="d-flex justify-content-between align-items-center mb-3">
                    <h2 class="h3 mb-0">Solicitacoes de horario</h2>
                    <button id="refreshButton" class="btn btn-outline-soft" type="button" title="Atualizar"><i class="bi bi-arrow-clockwise"></i></button>
                  </div>
                  <div class="table-responsive">
                    <table class="table align-middle">
                      <thead>
                        <tr>
                          <th>Cliente</th>
                          <th>Servico</th>
                          <th>Data</th>
                          <th>Horario</th>
                          <th>Status</th>
                        </tr>
                      </thead>
                      <tbody id="appointmentsBody"></tbody>
                    </table>
                  </div>
                  <div id="appointmentsEmpty" class="muted"></div>
                </section>
              </div>
            </div>
          </section>
        </div>
      </div>
    </main>

    <script src="/api.js"></script>
    <script src="/dashboard.js"></script>
  </body>
</html>
