<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin | Vieira Barbearia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/styles.css" rel="stylesheet">
  </head>
  <body>
    <main class="auth-page">
      <section class="auth-card">
        <p class="eyebrow">Vieira Barbearia</p>
        <h1 class="display-font mb-4">Admin</h1>
        <p class="muted fs-4 mb-4">Entre para acompanhar e gerenciar os agendamentos da barbearia.</p>
        <form id="loginForm" class="d-grid gap-4">
          <div>
            <label class="form-label fw-bold" for="username">Usuario</label>
            <input class="form-control form-control-lg" id="username" value="admin" autocomplete="username" required>
          </div>
          <div>
            <label class="form-label fw-bold" for="password">Senha</label>
            <input class="form-control form-control-lg" id="password" type="password" value="admin123" autocomplete="current-password" required>
          </div>
          <button class="btn btn-orange btn-lg py-3" type="submit">Entrar no painel</button>
          <div id="loginMessage" class="alert-line"></div>
        </form>
        <div class="d-flex justify-content-between gap-3 mt-4">
          <a href="/">Voltar para agenda</a>
          <a href="/register.html">Criar cadastro</a>
        </div>
      </section>
    </main>
    <script src="/api.js"></script>
    <script src="/login.js"></script>
  </body>
</html>
